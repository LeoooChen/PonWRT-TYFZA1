name: Check LAN initialization, PON VLANs and QSPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run production-code regression tests
        run: |
          mkdir -p artifacts logs
          python3 scripts/test_lan_probe_isolation.py
          python3 scripts/test_lan_async.py
          python3 scripts/test_qspi_poll.py
          python3 scripts/test_lan_pm_mapping.py
          python3 scripts/test_lan_link_mode.py
          python3 scripts/test_fe_lan_lifecycle.py
          python3 scripts/test_itu_pppoe_datapath.py
          python3 scripts/test_sta_client_lifecycle.py
          python3 scripts/test_radio_mesh.py
          python3 scripts/test_sta_beacon.py
          python3 scripts/test_sta_scan_offload.py
          python3 scripts/test_wifi_station_release.py
          python3 scripts/test_wifi_notifier.py
          python3 scripts/test_wifi_authorization.py
          python3 scripts/test_fe_wifi_peer_route.py
          python3 scripts/test_package_timeout.py
          python3 scripts/test_radio_ni_retire_flush.py
          python3 scripts/test_wifi_ni_retirement.py
          python3 scripts/test_radio_rx_ba_cleanup.py
          python3 tools/test_wifi_rx_ba_sessions.py
          python3 scripts/test_wifi_offload_transaction.py
          python3 scripts/test_radio_key_cleanup.py
          python3 scripts/test_ni_release_inflight.py
          python3 scripts/test_radio_basic_control.py
          python3 scripts/test_radio_ba_trigger.py
          python3 scripts/test_radio_rpq_batch.py
          python3 scripts/test_radio_txbd_dma.py
          python3 scripts/test_wifi_packet_steering.py
          python3 scripts/test_wifi_tx_request.py
      - name: Verify PE completion records and publication
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18
          python3 -m venv artifacts/pe-test-env
          artifacts/pe-test-env/bin/pip install unicorn==2.1.4
          PE_RADIO_CFLAGS=-DPE_UPLINK sh scripts/build_pe_radio_wd.sh artifacts/pe-check
          cmp artifacts/pe-check/pe-tx-code.h port/overlay/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pe-tx-code.h
          artifacts/pe-test-env/bin/python scripts/test_pe_rpq_firmware.py artifacts/pe-check/pe-tx.bin
          artifacts/pe-test-env/bin/python scripts/test_pe_tx_publication.py artifacts/pe-check
          artifacts/pe-test-env/bin/python scripts/test_pe_instruction_memory.py artifacts/pe-check
          artifacts/pe-test-env/bin/python scripts/test_pe_cpu_epp_gate.py artifacts/pe-check
          artifacts/pe-test-env/bin/python scripts/test_pe_sta_rx.py artifacts/pe-check
          artifacts/pe-test-env/bin/python scripts/test_pe_sta_tx.py artifacts/pe-check
          artifacts/pe-test-env/bin/python scripts/test_pe_host_headers.py artifacts/pe-check/pe-tx.bin
